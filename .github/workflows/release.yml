name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r "oryx-diff-$VERSION.zip" . -x ".git/*" ".github/*" "releases/*" "screenshots/*" ".gitignore" ".DS_Store"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: oryx-diff-*.zip
          generate_release_notes: true
