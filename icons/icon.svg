<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Oryx Diff: two keycaps, before (outlined) and after (solid). Base colour is the one fill on the background rect. -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#F28C28"/>
  <!-- "before" keycap, outlined, back left -->
  <rect x="22" y="22" width="56" height="56" rx="12" fill="none" stroke="#fff" stroke-width="9"/>
  <!-- "after" keycap, solid, front right -->
  <rect x="50" y="50" width="56" height="56" rx="12" fill="#fff"/>
  <!-- change marker on the front key -->
  <circle cx="78" cy="78" r="9" fill="#F28C28"/>
</svg>
